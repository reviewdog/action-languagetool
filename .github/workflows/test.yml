name: Test
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test-check:
    permissions:
      checks: write # the github-check reporter creates a check run
      contents: read
      pull-requests: read # reviewdog reads the pull request diff
    name: runner / languagetool (github-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-check
          level: info

  test-pr-check:
    permissions:
      checks: write # the github-pr-check reporter creates a check run
      contents: read
      pull-requests: read # reviewdog reads the pull request diff
    if: github.event_name == 'pull_request'
    name: runner / languagetool (github-pr-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-check
          level: info

  test-pr-review:
    permissions:
      contents: read
      pull-requests: write # the github-pr-review reporter posts review comments
    if: github.event_name == 'pull_request'
    name: runner / languagetool (github-pr-review)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          level: info
          patterns: "**.md"
          custom_api_endpoint: https://languagetool.org/api
