name: reviewdog
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    permissions:
      checks: write # the github-check reporter creates a check run on pushes
      contents: read
      pull-requests: write # the github-pr-review reporter posts review comments
    name: runner / shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: haya14busa/action-cond@v1.2.1
        id: reporter
        with:
          cond: ${{ github.event_name == 'pull_request' }}
          if_true: "github-pr-review"
          if_false: "github-check"
      - uses: reviewdog/action-shellcheck@v1.35.1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: ${{ steps.reporter.outputs.value }}
          level: warning

  hadolint:
    permissions:
      checks: write # the github-check reporter creates a check run on pushes
      contents: read
      pull-requests: write # the github-pr-review reporter posts review comments
    name: runner / hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: haya14busa/action-cond@v1.2.1
        id: reporter
        with:
          cond: ${{ github.event_name == 'pull_request' }}
          if_true: "github-pr-review"
          if_false: "github-check"
      - uses: reviewdog/action-hadolint@v1.50.2
        with:
          github_token: ${{ secrets.github_token }}
          reporter: ${{ steps.reporter.outputs.value }}
          level: warning

  misspell:
    permissions:
      checks: write # the github-check reporter creates a check run
      contents: read
      pull-requests: read # reviewdog reads the pull request diff
    name: runner / misspell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: reviewdog/action-misspell@v1.30.4
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-check
          level: warning
          locale: "US"
